<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat — DGS Rent a Car</title>
<link rel="icon" href="../assets/logo.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="../index.html" class="brand"><img src="../assets/logo.png" alt="DGS Rent a Car" class="logo-anim" /></a>
    <a href="fleet.html" class="side-link"><span class="ic"><i class="ph-bold ph-car"></i></span> Flota</a>
    <a href="reservations.html" class="side-link"><span class="ic"><i class="ph-bold ph-calendar-check"></i></span> Mis reservaciones</a>
    <a href="chat.html" class="side-link active"><span class="ic"><i class="ph-bold ph-chat-circle-dots"></i></span> Chat<span class="side-badge" id="chat-badge" style="display:none"></span></a>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatar">--</div>
        <div class="who"><b id="user-name">-</b><span id="user-email">-</span></div>
      </div>
      <a href="#" class="side-link" onclick="dgsLogout();return false;" style="margin-top:8px"><span class="ic"><i class="ph-bold ph-sign-out"></i></span> Cerrar sesion</a>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar"><h1>Chat con soporte</h1></div>
    <div class="content">
      <div class="panel chat-panel">
        <div class="chat-messages" id="chat-messages">
          <div class="skeleton" style="height:60px;margin:24px"></div>
        </div>
        <form class="chat-input-row" id="chat-form">
          <input type="text" id="chat-input" placeholder="Escribe tu mensaje..." maxlength="2000" autocomplete="off" />
          <button type="submit" class="btn btn-primary btn-sm" id="chat-send"><i class="ph-bold ph-paper-plane-tilt"></i> Enviar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/chat-badge.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
