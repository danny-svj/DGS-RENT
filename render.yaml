services:
  - type: web
    name: dgs-rent-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data.sqlite
      - key: NODE_VERSION
        value: 22.17.0
