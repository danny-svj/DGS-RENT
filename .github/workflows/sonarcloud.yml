name: Calidad - SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest
    # Este job requiere el secreto SONAR_TOKEN configurado en
    # Settings > Secrets and variables > Actions del repositorio.
    # Mientras no exista, el job se omite automaticamente.
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y generar cobertura
        working-directory: backend
        run: |
          npm ci
          npm run test:coverage

      - name: Analisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
