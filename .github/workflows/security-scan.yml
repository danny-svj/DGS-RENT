name: Seguridad - OWASP ZAP baseline scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Levantar API en segundo plano
        working-directory: backend
        run: |
          JWT_SECRET=ci-secret DB_PATH=./ci-data.sqlite PORT=4000 nohup npm start > server.log 2>&1 &
          npx wait-on http://localhost:4000/api/health --timeout 30000

      - name: Escaneo baseline con OWASP ZAP
        uses: zaproxy/action-baseline@master
        with:
          target: 'http://localhost:4000/api/health'
          fail_action: false
          cmd_options: '-a'

      - name: Subir reporte de ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
